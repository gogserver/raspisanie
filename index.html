<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание занятий</title>
<style>
/* ИСПРАВЛЕНО: Безопасные цвета без 8-значных HEX-кодов, чтобы iOS не ломался */
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #697386;
  --accent: #315efb;
  --line: #d8dce8; 
  --soft: #eef2ff;
  --header1: #172554;
  --header2: #315efb;
  --shadow: rgba(23, 32, 51, 0.08); 
}
:root.dark {
  --bg: #0d1117;
  --card: #161b22;
  --text: #e6edf3;
  --muted: #9aa4b2;
  --accent: #6d8cff;
  --line: #30363d;
  --soft: #202938;
  --header1: #090d15;
  --header2: #1b2f69;
  --shadow: rgba(0, 0, 0, 0.35); 
}

/* ИСПРАВЛЕНО: Жесткое скрытие элементов для капризных браузеров */
[hidden] { display: none !important; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.header { background: linear-gradient(135deg, var(--header1), var(--header2)); color: #fff; padding: 12px 20px; }
.wrap { max-width: 1180px; margin: auto; }

.picker { min-height: calc(100vh - 80px); display: grid; place-items: center; padding: 20px; }
.picker-card { width: min(620px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 0 10px 30px var(--shadow); text-align: center; }
.picker-kicker { text-transform: uppercase; letter-spacing: .12em; font-size: 12px; font-weight: 800; color: var(--accent); }
.picker-card h2 { margin: 8px 0; font-size: 26px; }
.picker-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
.picker-groups { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.picker-groups button { padding: 12px 8px; font-size: 16px; }

.theme-btn { margin-left: auto; white-space: nowrap; }
.date-tabs { border-top: 1px solid var(--line); background: var(--card); }
.date-tabs-inner { max-width: 1180px; margin: auto; padding: 0 20px; display: flex; align-items: center; gap: 14px; }
.date-tabs .days { padding: 8px 0; }

h1 { margin: 0 0 2px; font-size: clamp(18px, 4vw, 24px); }
.subtitle { opacity: .82; font-size: 12px; }

.toolbar { background: var(--card); border-bottom: 1px solid var(--line); position: relative; z-index: 10; }
.toolbar-inner { max-width: 1180px; margin: auto; padding: 8px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.label { font-size: 12px; color: var(--muted); font-weight: 700; margin-right: 2px; }

/* ИСПРАВЛЕНО: Сброс стандартного стиля кнопок Apple */
button { -webkit-appearance: none; appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 12px; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; transition: .18s; }
button:hover { transform: translateY(-1px); border-color: var(--accent); }
button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.days { display: flex; gap: 6px; overflow: auto; padding: 8px 20px; scrollbar-width: thin; }
.daybtn { min-width: 90px; text-align: center; font-size: 13px; }
.daybtn small { display: block; font-weight: 500; opacity: .72; margin-top: 2px; }

main { max-width: 1180px; margin: 12px auto; padding: 0 20px 20px; }
.day-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.day-title h2 { margin: 0; font-size: 20px; }
.date { color: var(--muted); font-weight: 600; font-size: 13px; }

.lesson-list { display: grid; gap: 6px; }
.lesson { display: grid; grid-template-columns: 90px 1fr; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 1px 4px var(--shadow); align-items: center; }
.lesson.empty { opacity: .55; background: transparent; box-shadow: none; border-style: dashed; }
.time { font-weight: 800; color: var(--accent); font-size: 13px; }
.pair { color: var(--muted); font-size: 11px; margin-top: 2px; }
.subject { font-size: 14px; font-weight: 700; line-height: 1.2; }
.note { margin-top: 12px; color: var(--muted); font-size: 12px; text-align: center; }

@media (max-width: 650px) {
  .header { padding: 8px 12px; }
  .toolbar-inner { padding: 6px 12px; }
  button { padding: 6px 8px; font-size: 13px; }
  .theme-btn { margin-left: 0; }
  .date-tabs-inner { padding: 0 12px; align-items: flex-start; flex-direction: column; gap: 0; }
  .date-tabs .days { width: 100%; padding-top: 4px; padding-bottom: 6px; }
  .days { padding: 0; }
  main { padding: 0 12px 10px; margin-top: 8px; }
  .day-title { margin-bottom: 8px; }
  .daybtn { min-width: 75px; padding: 6px; font-size: 12px; }
  .lesson { grid-template-columns: 75px 1fr; gap: 8px; padding: 8px; }
  .time { font-size: 12px; }
  .pair { font-size: 10px; }
  .subject { font-size: 13px; }
  .picker { padding: 14px; }
  .picker-card { padding: 20px 14px; }
  .picker-groups { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<h1>Расписание занятий</h1>
<div class="subtitle">4 курс • 7 семестр • 2026/2027 учебный год</div>
</div></header>

    <p>После выбора откроется расписание на текущую дату.</p>
    <div id="pickerGroups" class="picker-groups"></div>
  </div>
</div>

  <div class="toolbar">
    <div class="toolbar-inner">

      <div id="groups"></div>
      <button id="themeToggle" class="theme-btn" onclick="toggleTheme()" aria-label="Переключить тему">🌙 Тёмная</button>

    <div class="date-tabs">

        <span class="label">Дата занятий</span>

    </div>
  </div>
  <main id="app"></main>
</div>

const GROUPS = ["3301", "3302"];
const DAY_ORDER = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const TIMES = {"1": "08:30–09:50", "2": "10:00–11:20", "3": "11:30–12:50", "4": "14:20–15:40", "5": "15:50–17:10", "6": "17:20–18:40"};

function storageGet(key, fallback=""){
  try { return window.localStorage.getItem(key) ?? fallback; }
  catch(e) { return fallback; }
}
function storageSet(key, value){
  try { window.localStorage.setItem(key, value); } catch(e) {}
}

function applyTheme(){
  const theme=storageGet("theme","light");
  document.documentElement.classList.toggle("dark", theme==="dark");
  const btn=document.getElementById("themeToggle");
  if(btn) btn.textContent = theme==="dark" ? "☀️ Светлая" : "🌙 Тёмная";
}
function toggleTheme(){
  const isDark=document.documentElement.classList.contains("dark");
  storageSet("theme", isDark ? "light" : "dark");
  applyTheme();
}

let currentGroup = storageGet("group","");
let currentDay = "";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function parseDate(s){
  const [d,m,y]=s.split(".").map(Number);
  return new Date(y,m-1,d);
}
function todayString(){
  const now=new Date();
  return String(now.getDate()).padStart(2,"0")+"."+String(now.getMonth()+1).padStart(2,"0")+"."+now.getFullYear();
}
function getInitialDate(group){
  const dates=[...DATA[group]].sort((a,b)=>parseDate(a.date)-parseDate(b.date));
  const today=parseDate(todayString());
  return dates.find(x=>x.date===today)?.date
      || dates.find(x=>parseDate(x.date)>=today)?.date
      || dates[dates.length-1]?.date
      || "";
}
function sortedDates(){return [...DATA[currentGroup]].sort((a,b)=>parseDate(a.date)-parseDate(b.date));}
function renderPicker(){
  const box=document.getElementById("pickerGroups");
  box.innerHTML=GROUPS.map(g=>`<button onclick="chooseGroup('${g}')">${g}</button>`).join("");
}
function renderGroups(){
  const box=document.getElementById("groups");
  box.innerHTML=GROUPS.map(g=>`<button class="${g===currentGroup?'active':''}" onclick="setGroup('${g}')">${g}</button>`).join(" ");
}
function renderDates(){
  const box=document.getElementById("days");
  box.innerHTML=sortedDates().map(item=>`<button class="daybtn ${item.date===currentDay?'active':''}" onclick="setDay('${item.date}')">${item.date}<small>${item.day}</small></button>`).join("");
  const active=box.querySelector(".active");
  if(active) active.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
}
function renderSchedule(){
  const item=DATA[currentGroup].find(x=>x.date===currentDay);
  const app=document.getElementById("app");
  if(!item){app.innerHTML="<p>Нет данных для выбранной даты.</p>";return;}
  const lessons=Object.keys(TIMES).map(p=>({p,time:TIMES[p],text:item.lessons[p]||""}));
  app.innerHTML=`
    <div class="day-title"><h2>${item.day}</h2><div class="date">${item.date} • группа ${currentGroup}</div></div>
    <div class="lesson-list">
      ${lessons.map(x=>{
        const empty=!x.text;
        return `<article class="lesson ${empty?'empty':''}">
          <div><div class="time">${x.time}</div><div class="pair">${x.p} пара</div></div>
          <div>${empty?'<div class="subject">Окно</div>':`<div class="subject">${esc(x.text)}</div>`}</div>
        </article>`;
      }).join("")}
    </div>
    <div class="note">Выберите другую дату в панели «Дата занятий» или переключите группу.</div>`;
}
function showSchedule(){
  document.getElementById("groupPicker").hidden=true;
  document.getElementById("scheduleUI").hidden=false;
  renderGroups(); renderDates(); renderSchedule();
}
function chooseGroup(g){
  if(!DATA[g]) return;
  currentGroup=g;
  currentDay=getInitialDate(g);
  storageSet("group",currentGroup); storageSet("day",currentDay);
  showSchedule();
}
function setGroup(g){chooseGroup(g);}
function setDay(d){
  if(!DATA[currentGroup].some(x=>x.date===d)) return;
  currentDay=d;
  storageSet("day",d);
  renderDates(); renderSchedule();
}
function render(){
  renderPicker();
  if(!currentGroup || !DATA[currentGroup]){
    currentGroup=""; currentDay="";
    document.getElementById("groupPicker").hidden=false;
    document.getElementById("scheduleUI").hidden=true;
    return;
  }
  if(!currentDay || !DATA[currentGroup].some(x=>x.date===currentDay)){
    currentDay=getInitialDate(currentGroup);
    storageSet("day",currentDay);
  }
  showSchedule();
}

applyTheme();
render();

</script>
